<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crowd tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&amp;family=Shantell+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff7a59}a:hover{color:#ffd04a}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0b0f1f; font-family: 'Shantell Sans', 'Comic Sans MS', cursive; color: #f4ead5">
  <img src="/_blob/c666baf500bb879daf153f03138ef07b" alt="The game: crowd of fans, auto launchers and fireworks in the night sky" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; object-fit: cover">

  <div style="position: absolute; left: 16px; top: 16px; width: 80px; height: 868px">
    <dc-import name="Rail" active="crowd" hint-size="80px,868px"></dc-import>
  </div>

  <div style="position: absolute; left: 104px; top: 16px; width: 288px; display: flex; gap: 8px">
    <div role="group" aria-label="Sparkles" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 12px 8px 12px 9px / 8px 12px 9px 12px; box-shadow: 3px 3px 0 #0a0918">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.8 2 C13 6.4 13.6 8.6 14.8 9.6 C16.2 10.6 18.4 11.4 22 12.8 C17.6 13 15.4 13.6 14.4 14.8 C13.4 16.2 12.6 18.4 11.2 22 C11 17.6 10.4 15.4 9.2 14.4 C7.8 13.4 5.6 12.6 2 11.2 C6.4 11 8.6 10.4 9.6 9.2 C10.6 7.8 11.4 5.6 12.8 2 Z" fill="#5fe0e0" stroke="#1a1733" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12" cy="12" r="1.5" fill="#fff3da" stroke="none"></circle><circle cx="19.6" cy="4.6" r="1.3" fill="#1a1733" stroke="none"></circle></svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Chewy', cursive; font-size: 21px; line-height: 1">6,420</span>
        <span style="font-size: 12px; font-weight: 700; line-height: 1.2; color: #4f4970">+182/s</span>
      </div>
    </div>
    <div role="group" aria-label="Gold" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 8px 12px 9px 12px / 12px 8px 12px 9px; box-shadow: 3px 3px 0 #0a0918">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd04a" stroke="#1a1733" stroke-width="1.8"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#1a1733" stroke-width="1.5" stroke-dasharray="2 2.2"></circle></svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Chewy', cursive; font-size: 21px; line-height: 1">2,135</span>
        <span style="font-size: 12px; font-weight: 700; line-height: 1.2; color: #4f4970">+41/s</span>
      </div>
    </div>
  </div>

  <section aria-label="Crowd" style="position: absolute; left: 104px; top: 76px; width: 288px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 24px; background-color: #1f2246; background-image: radial-gradient(rgba(255,243,218,0.09) 1.1px, transparent 1.4px); background-size: 14px 14px; border: 2px solid #f4ead5; border-radius: 18px 22px 16px 20px / 20px 16px 22px 18px; box-shadow: 6px 6px 0 #0a0918; overflow: hidden">

    <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Chewy', cursive; font-weight: 400; font-size: 28px; line-height: 1; color: #fff3da">Crowd</h1>
        <svg width="80" height="8" viewBox="0 0 80 8" fill="none" aria-hidden="true"><path d="M2 5 C12 1, 22 7, 34 4 S 54 1, 64 5 S 74 6, 78 3" stroke="#86e38f" stroke-width="3" stroke-linecap="round"></path></svg>
      </div>
      <button aria-label="Close panel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; color: #f4ead5; border: 2px solid rgba(244,234,213,0.5); border-radius: 12px 9px 13px 8px / 9px 13px 8px 12px; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5.4 5.8 C10 10.2 14 14.1 18.6 18.4"></path><path d="M18.4 5.6 C14 10 10 14 5.6 18.6"></path></svg>
      </button>
    </header>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 12px 9px 13px 8px / 9px 13px 8px 12px; box-shadow: 3px 3px 0 #0a0918">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 40px">
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-family: 'Chewy', cursive; font-size: 40px; line-height: 1">16</span>
          <span style="font-size: 15px; font-weight: 800">fans</span>
        </div>
        <span style="display: flex; align-items: center; gap: 4px; font-family: 'Chewy', cursive; font-size: 18px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd04a" stroke="#1a1733" stroke-width="2"></circle><circle cx="12" cy="12" r="4.6" fill="none" stroke="#1a1733" stroke-width="1.6"></circle></svg>+41/s
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 13px; font-weight: 700">Next fan</span>
          <span style="font-family: 'Chewy', cursive; font-size: 16px">66/100</span>
        </div>
        <div role="img" aria-label="66 of 100 fireworks to the next fan" style="height: 14px; box-sizing: border-box; background: #fff7e6; border: 2px solid #1a1733; border-radius: 8px 5px 7px 6px; overflow: hidden">
          <div style="width: 66%; height: 100%; background: #86e38f; border-right: 2px solid #1a1733; box-sizing: border-box"></div>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fans":{"editor":"int","min":0,"max":20,"default":16},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const fans = Math.max(0, Math.min(20, this.props.fans ?? 16));
    const tints = ['#d9d6f2', '#c9c4ee', '#e4e1f8', '#cfd0f0'];
    const seats = [];
    for (let i = 0; i < 20; i++) {
      const filled = i < fans;
      seats.push({
        filled: filled,
        body: filled ? 'background:' + tints[i % tints.length] + '; border:2px solid #1a1733;' : 'background:transparent; border:2px dashed rgba(244,234,213,0.4);'
      });
    }
    return { seats: seats };
  }
}
</script>
</body>
</html>

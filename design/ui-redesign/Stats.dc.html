<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&amp;family=Shantell+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff7a59}a:hover{color:#ffd04a}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0b0f1f; font-family: 'Shantell Sans', 'Comic Sans MS', cursive; color: #f4ead5">
  <img src="/_blob/c666baf500bb879daf153f03138ef07b" alt="The game: crowd of fans, auto launchers and fireworks in the night sky" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; object-fit: cover">

  <div style="position: absolute; left: 16px; top: 16px; width: 80px; height: 868px">
    <dc-import name="Rail" active="stats" hint-size="80px,868px"></dc-import>
  </div>

  <div style="position: absolute; left: 104px; top: 16px; width: 288px; display: flex; gap: 8px">
    <div role="group" aria-label="Sparkles" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 12px 8px 12px 9px / 8px 12px 9px 12px; box-shadow: 3px 3px 0 #0a0918">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.8 2 C13 6.4 13.6 8.6 14.8 9.6 C16.2 10.6 18.4 11.4 22 12.8 C17.6 13 15.4 13.6 14.4 14.8 C13.4 16.2 12.6 18.4 11.2 22 C11 17.6 10.4 15.4 9.2 14.4 C7.8 13.4 5.6 12.6 2 11.2 C6.4 11 8.6 10.4 9.6 9.2 C10.6 7.8 11.4 5.6 12.8 2 Z" fill="#5fe0e0" stroke="#1a1733" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12" cy="12" r="1.5" fill="#fff3da" stroke="none"></circle><circle cx="19.6" cy="4.6" r="1.3" fill="#1a1733" stroke="none"></circle></svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Chewy', cursive; font-size: 21px; line-height: 1">6,420</span>
        <span style="font-size: 12px; font-weight: 700; line-height: 1.2; color: #4f4970">+182/s</span>
      </div>
    </div>
    <div role="group" aria-label="Gold" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 8px 12px 9px 12px / 12px 8px 12px 9px; box-shadow: 3px 3px 0 #0a0918">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd04a" stroke="#1a1733" stroke-width="1.8"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#1a1733" stroke-width="1.5" stroke-dasharray="2 2.2"></circle></svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Chewy', cursive; font-size: 21px; line-height: 1">2,135</span>
        <span style="font-size: 12px; font-weight: 700; line-height: 1.2; color: #4f4970">+41/s</span>
      </div>
    </div>
  </div>

  <section aria-label="Stats" style="position: absolute; left: 104px; top: 76px; width: 288px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 24px; background-color: #1f2246; background-image: radial-gradient(rgba(255,243,218,0.09) 1.1px, transparent 1.4px); background-size: 14px 14px; border: 2px solid #f4ead5; border-radius: 18px 22px 16px 20px / 20px 16px 22px 18px; box-shadow: 6px 6px 0 #0a0918; overflow: hidden">

    <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Chewy', cursive; font-weight: 400; font-size: 28px; line-height: 1; color: #fff3da">Stats</h1>
        <svg width="72" height="8" viewBox="0 0 72 8" fill="none" aria-hidden="true"><path d="M2 5 C10 1, 20 7, 30 4 S 48 1, 58 5 S 66 6, 70 3" stroke="#ffd04a" stroke-width="3" stroke-linecap="round"></path></svg>
      </div>
      <button aria-label="Close panel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; color: #f4ead5; border: 2px solid rgba(244,234,213,0.5); border-radius: 12px 9px 13px 8px / 9px 13px 8px 12px; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5.4 5.8 C10 10.2 14 14.1 18.6 18.4"></path><path d="M18.4 5.6 C14 10 10 14 5.6 18.6"></path></svg>
      </button>
    </header>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Chewy', cursive; font-weight: 400; font-size: 20px; line-height: 24px; color: #fff3da">Right now</h2>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 12px 9px 13px 8px / 9px 13px 8px 12px; box-shadow: 3px 3px 0 #0a0918">
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.8 2 C13 6.4 13.6 8.6 14.8 9.6 C16.2 10.6 18.4 11.4 22 12.8 C17.6 13 15.4 13.6 14.4 14.8 C13.4 16.2 12.6 18.4 11.2 22 C11 17.6 10.4 15.4 9.2 14.4 C7.8 13.4 5.6 12.6 2 11.2 C6.4 11 8.6 10.4 9.6 9.2 C10.6 7.8 11.4 5.6 12.8 2 Z" fill="#5fe0e0" stroke="#1a1733" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12" cy="12" r="1.5" fill="#fff3da" stroke="none"></circle><circle cx="19.6" cy="4.6" r="1.3" fill="#1a1733" stroke="none"></circle></svg>
          <span style="font-family: 'Chewy', cursive; font-size: 28px; line-height: 1">182</span>
          <span style="font-size: 13px; font-weight: 700">sparkles/s</span>
        </div>
        <div role="img" aria-label="Launchers 62%, generators 18%, fans 12%, clicks 8%" style="display: flex; height: 20px; box-sizing: border-box; border: 2px solid #1a1733; border-radius: 8px 6px 8px 7px; overflow: hidden">
          <span style="width: 62%; background: #ff7a59; border-right: 2px solid #1a1733"></span>
          <span style="width: 18%; background: #5fe0e0; border-right: 2px solid #1a1733"></span>
          <span style="width: 12%; background: #86e38f; border-right: 2px solid #1a1733"></span>
          <span style="width: 8%; background: #ffd04a"></span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">
          <li style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="width: 12px; height: 12px; box-sizing: border-box; background: #ff7a59; border: 2px solid #1a1733; border-radius: 3px"></span>Launchers<span style="margin-left: auto; font-family: 'Chewy', cursive; font-size: 16px">113</span></li>
          <li style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="width: 12px; height: 12px; box-sizing: border-box; background: #5fe0e0; border: 2px solid #1a1733; border-radius: 3px"></span>Generators<span style="margin-left: auto; font-family: 'Chewy', cursive; font-size: 16px">33</span></li>
          <li style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="width: 12px; height: 12px; box-sizing: border-box; background: #86e38f; border: 2px solid #1a1733; border-radius: 3px"></span>Fans<span style="margin-left: auto; font-family: 'Chewy', cursive; font-size: 16px">22</span></li>
          <li style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="width: 12px; height: 12px; box-sizing: border-box; background: #ffd04a; border: 2px solid #1a1733; border-radius: 3px"></span>Clicks<span style="margin-left: auto; font-family: 'Chewy', cursive; font-size: 16px">14</span></li>
        </ul>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 11px 8px 12px 9px; box-shadow: 3px 3px 0 #0a0918">
          <div style="display: flex; align-items: center; gap: 6px">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd04a" stroke="#1a1733" stroke-width="2"></circle><circle cx="12" cy="12" r="4.6" fill="none" stroke="#1a1733" stroke-width="1.6"></circle></svg>
            <span style="font-family: 'Chewy', cursive; font-size: 24px; line-height: 1">41</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #4f4970">gold/s</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #fff3da; color: #1a1733; border: 2px solid #1a1733; border-radius: 8px 11px 9px 12px; box-shadow: 3px 3px 0 #0a0918">
          <div style="display: flex; align-items: center; gap: 6px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1733" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 9 L12 3.6 M12.1 15 L12 20.4 M9 12 L3.6 12.1 M15 12 L20.4 11.9 M9.9 9.9 L6.2 6.3 M14.2 14.1 L17.8 17.7 M14.1 9.8 L17.7 6.2 M9.8 14.2 L6.3 17.8"></path><circle cx="12" cy="12" r="1.6" fill="#ff6fae" stroke="none"></circle></svg>
            <span style="font-family: 'Chewy', cursive; font-size: 24px; line-height: 1">4.6</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #4f4970">fireworks/s</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Chewy', cursive; font-weight: 400; font-size: 20px; line-height: 24px; color: #fff3da">This session</h2>
      <dl style="margin: 0; display: flex; flex-direction: column; background: #2a2e5e; border: 2px solid rgba(244,234,213,0.4); border-radius: 12px 9px 13px 8px / 9px 13px 8px 12px">
        <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-bottom: 2px dashed rgba(244,234,213,0.2)"><dt style="font-size: 13px; font-weight: 600; color: #e6dcc6">Played</dt><dd style="margin: 0; font-family: 'Chewy', cursive; font-size: 17px; color: #fff3da">14m 32s</dd></div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-bottom: 2px dashed rgba(244,234,213,0.2)"><dt style="font-size: 13px; font-weight: 600; color: #e6dcc6">Sparkles</dt><dd style="margin: 0; font-family: 'Chewy', cursive; font-size: 17px; color: #fff3da">182.4K</dd></div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-bottom: 2px dashed rgba(244,234,213,0.2)"><dt style="font-size: 13px; font-weight: 600; color: #e6dcc6">Gold</dt><dd style="margin: 0; font-family: 'Chewy', cursive; font-size: 17px; color: #fff3da">31.2K</dd></div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; border-bottom: 2px dashed rgba(244,234,213,0.2)"><dt style="font-size: 13px; font-weight: 600; color: #e6dcc6">Fireworks</dt><dd style="margin: 0; font-family: 'Chewy', cursive; font-size: 17px; color: #fff3da">3,912</dd></div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px"><dt style="font-size: 13px; font-weight: 600; color: #e6dcc6">Caught by fans</dt><dd style="margin: 0; font-family: 'Chewy', cursive; font-size: 17px; color: #fff3da">8,240</dd></div>
      </dl>
    </div>
  </section>
</div>
</x-dc>

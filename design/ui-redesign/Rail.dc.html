<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Chewy&amp;family=Shantell+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

</helmet>

  <button aria-label="Upgrades" style="position: relative; width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{upgradesBtn}}">

    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Upgrades</span>
    <span style="position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ff7a59; color: #1a1733; border: 2px solid #1a1733; border-radius: 50% 46% 52% 48%; font-size: 11px; font-weight: 800">3</span>
  </button>

  <button aria-label="Buildings" style="position: relative; width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{buildingsBtn}}">

    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Buildings</span>
  </button>

  <button aria-label="Crowd" style="position: relative; width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{crowdBtn}}">
    <span style="width: 36px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 45% 55% 50% 50% / 52% 48% 52% 48%; {{crowdBlob}}">

    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Crowd</span>
  </button>

  <button aria-label="Fireworks" style="position: relative; width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{fireworksBtn}}">
    <span style="width: 36px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 55% 45% 48% 52% / 48% 52% 48% 52%; {{fireworksBlob}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9 L12 3.6 M12.1 15 L12 20.4 M9 12 L3.6 12.1 M15 12 L20.4 11.9 M9.9 9.9 L6.2 6.3 M14.2 14.1 L17.8 17.7 M14.1 9.8 L17.7 6.2 M9.8 14.2 L6.3 17.8"></path><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="2" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="21.9" cy="12" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="2.1" cy="12" r="0.9" fill="currentColor" stroke="none"></circle></svg>
    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Fireworks</span>
  </button>

  <div style="flex-grow: 1"></div>

  <svg width="48" height="8" viewBox="0 0 48 8" fill="none" aria-hidden="true"><path d="M2 4 C6 1, 10 7, 14 4 S 22 1, 26 4 S 34 7, 38 4 S 44 2, 46 4" stroke="#f4ead5" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"></path></svg>

  <button aria-label="Stats" style="position: relative; width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{statsBtn}}">
    <span style="width: 36px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; {{statsBlob}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 20.4 C9 20.1 15 20.2 20.6 20.6"></path><path d="M6 20 L6.2 14.2 M10.6 20.1 L10.4 10.2 M15.2 20 L15.3 12.6 M19.4 20.1 L19.6 6.8"></path><path d="M4.6 9.6 C7.4 7.4 9.6 8.8 12 6.6 C14.2 4.6 16.4 5.4 19.4 3.4"></path></svg>
    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Stats</span>
  </button>

  <button aria-label="Settings" style="position: relative; width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px 10px 13px 9px / 10px 14px 9px 13px; cursor: pointer; padding: 0; font-family: inherit; {{settingsBtn}}">
    <span style="width: 36px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 52% 48% 55% 45% / 45% 55% 45% 55%; {{settingsBlob}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 6.8 C9 6.6 15 6.7 20.2 7 M3.8 12.1 C9 11.9 15 12 20.2 12.2 M3.8 17.3 C9 17.1 15 17.2 20.2 17.4"></path><circle cx="9" cy="6.8" r="2.2" fill="currentColor"></circle><circle cx="15.6" cy="12.1" r="2.2" fill="currentColor"></circle><circle cx="7.4" cy="17.3" r="2.2" fill="currentColor"></circle></svg>
    </span>
    <span style="font-size: 11px; font-weight: 700; line-height: 1">Settings</span>
  </button>

  <div style="width: 64px; box-sizing: border-box; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px dashed rgba(244,234,213,0.4); border-radius: 12px 9px 11px 8px / 9px 12px 8px 11px">
    <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #c9bfa8">dev</span>
    <button aria-label="Cheats" style="width: 52px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 10px 8px 9px 7px; cursor: pointer; padding: 0; font-family: inherit; {{cheatsBtn}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 19.8 L14.2 9.6"></path><path d="M17.4 2.8 L18.3 5.1 L20.6 6 L18.3 6.9 L17.4 9.2 L16.5 6.9 L14.2 6 L16.5 5.1 Z"></path><path d="M8 4 L8 6 M7 5 L9 5 M20 13 L20 15 M19 14 L21 14"></path></svg>
      <span style="font-size: 10px; font-weight: 700; line-height: 1">Cheats</span>
    </button>
    <button aria-label="Bot" style="width: 52px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 8px 10px 7px 9px; cursor: pointer; padding: 0; font-family: inherit; {{botBtn}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 9.6 C5.3 8.5 6.1 7.8 7.2 7.8 L16.9 8 C18 8 18.8 8.9 18.7 10 L18.5 17 C18.5 18.1 17.6 18.8 16.5 18.8 L7.1 18.6 C6 18.6 5.2 17.7 5.3 16.6 Z"></path><path d="M12 7.8 L12.1 4.6"></path><circle cx="12.1" cy="3.6" r="1.1"></circle><circle cx="9.3" cy="12.6" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="14.8" cy="12.6" r="1.2" fill="currentColor" stroke="none"></circle><path d="M9.6 15.8 C11.2 16.5 12.8 16.5 14.4 15.8"></path></svg>
      <span style="font-size: 10px; font-weight: 700; line-height: 1">Bot</span>
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["upgrades","buildings","crowd","fireworks","stats","settings","cheats","bot","none"],"default":"upgrades"},"$preview":{"width":80,"height":868}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'upgrades';
    const accents = {
      upgrades: '#ff7a59', buildings: '#5fe0e0', crowd: '#86e38f', fireworks: '#ff6fae',
      stats: '#ffd04a', settings: '#b9a3ff', cheats: '#ffd04a', bot: '#5fe0e0'
    };
    const on = 'background: #fff3da; color: #1a1733; border: 2px solid #1a1733; box-shadow: 3px 3px 0 #0a0918; transform: rotate(-2deg) translateX(4px);';
    const off = 'background: transparent; color: #f4ead5; border: 2px solid transparent; box-shadow: none;';
    const vals = {};
    for (const key of Object.keys(accents)) {
      const isOn = key === active;
      vals[key + 'Btn'] = isOn ? on : off;
      vals[key + 'Blob'] = isOn ? 'background: ' + accents[key] + ';' : 'background: transparent;';
    }
    return vals;
  }
}
</script>
</body>
</html>
